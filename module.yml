#
# robohub-stm32 — the STM32 platform for the RoboHub Platform.
#
# This module implements the platform-independent interfaces declared by
# robohub-common against STMicroelectronics' STM32 HAL and CMSIS, and carries a
# board support package for each supported development board.
#
# This manifest is the platform's own description and is edited here. What it
# declares is read by the toolchain rather than searched for: `hardware` says
# where the boards, presets and target specs are, and each of those says where
# its own contents are.
#
# SPDX-License-Identifier: MIT
#

module:
  name: robohub-stm32
  type: platform
  version: 0.1.0
  description: >
    STM32 platform for the RoboHub Platform. Implements the RoboHub HAL
    interfaces and the platform initialisation contract on top of the STM32 HAL
    and CMSIS, and carries a board support package for each supported board.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-09-30"

# No main: a platform is native code a project links, not something it runs.

# The platform this module implements.
#
# What makes a project recognizable as being built for RoboHub, from its module
# graph rather than from a repository name or a directory: a build walks the
# modules a project depends on, and one that declares `platform: robohub`
# identifies the platform. The plugins that serve that identity — the ones that
# map this platform's conventions onto the toolchain — are then chosen for it,
# and a project whose graph names no platform is built the standard way.
#
# The identity is the platform's, not this repository's: every RoboHub platform
# declares the same one, so a program written against the interfaces builds the
# same way whichever of them it is given.
platform: robohub

# Where this platform keeps the declarations of the hardware it supports.
#
# A build reads these rather than looking for a directory that happens to be
# called `targets` beside a dependency. That is the whole of the contract: a
# consumer is told which of this module's own folders holds a board's memory map
# and how it is reached, so a platform may name its folders as it likes, and a
# project never has to carry a path that only means something on the machine it
# was written on.
#
# Each is absolute, or a folder inside this module. Nothing here reaches out of
# it, and nothing may: a path with `../` in it is a statement about where this
# checkout was put rather than a declaration of where the declarations are.
# Where this checkout keeps the vendor code a board builds against.
#
# The same contract each board carries, stated once for the platform: a path that
# already holds a repository is used as it is, and one that holds nothing is
# where it is cloned. Stated here as well as in the boards because the vendor
# tree is the platform's, and a board that declared one would be a second place
# for the same fact to differ.
vendor:
  dir: vendor

hardware:
  # Where this platform keeps the declarations of the hardware it supports.
  #
  # `boards` is the directory of its boards. Each board is read through its own
  # manifest — which says where its own presets are, which target spec it carries
  # and where its vendor repositories live — rather than being enumerated here.
  #
  # A board may have several presets, one per way of building it, so the platform
  # does not list them: a list here would be a second thing to keep in step with
  # the board, and it would cap a board at one.
  boards: boards
  # The boards this platform supports, which is a smaller list than the directory.
  #
  # A board is in the directory as soon as it has a pinout to describe; it is in
  # this list when a build for it works — a target spec the build can read, a
  # vendor tree that can be fetched, a driver that compiles for it. The
  # difference is the whole reason this list exists: `boards/` answers "what has
  # anybody written down", and this answers "what can you build", and a directory
  # cannot tell you the second.
  #
  # Declared rather than derived, because it cannot be derived from anything. A
  # board's readiness is the accumulation of a dozen facts — a memory map, a set of
  # device defines, drivers that compile, a vendor tree — and there is no file
  # that says all of them at once.
  #
  # It is a contract rather than a note, and it is read as one. `tests/tests.yml`
  # builds a matrix from this list rather than restating it, so a board added here
  # is tested by the next run without anything else being edited — and, just as
  # usefully, a board that stops building cannot quietly go on being claimed.
  supported:
    - nucleo-f412zg
    - nucleo-f429zi
    - nucleo-f446ze
    - nucleo-h753zi
  # The presets this platform itself declares: one per family, saying what every
  # board of that family shares.
  presets: presets
  # The target specs for parts rather than boards, since two boards carrying the
  # same part are the same part. A board's own spec is with the board.
  targets: targets
  kconfig: kconfig

build:
  language: c
  standard: c11

  # Every directory a consumer needs on its include path, declared here so that a
  # build reads them rather than being told them.
  #
  # Which of the vendor HAL's drivers this platform uses.
  #
  # The vendor's umbrella header includes each driver's header only when that
  # driver's enable macro is defined, so a build that uses the GPIO driver and does
  # not say so compiles a GPIO source against a header that was never included, and
  # fails on `GPIO_MODE_OD` being undeclared — a symbol that is not part of the API
  # being wrong but part of a header that was not read.
  #
  # Declared rather than derived from which sources happen to be compiled: what is
  # enabled is what the platform supports, and a platform may support a driver it
  # does not itself use.
  defines:
    - USE_HAL_DRIVER
    - HAL_MODULE_ENABLED
    - HAL_GPIO_MODULE_ENABLED
    - HAL_RCC_MODULE_ENABLED
    - HAL_CORTEX_MODULE_ENABLED
    - HAL_UART_MODULE_ENABLED
    # The UART driver's own structures name a DMA handle, so enabling UART without
    # DMA compiles a header against a type that was never included. It is a
    # dependency of the driver this platform uses, not a feature it offers.
    - HAL_DMA_MODULE_ENABLED
    # The platform sets the flash latency when it changes the clock, and the
    # latency constants live in the flash driver.
    - HAL_FLASH_MODULE_ENABLED
    - HAL_PWR_MODULE_ENABLED

  # `include/` is for the headers a program includes by their own name, and
  # `include/robohub/hal/` for the interfaces, which are included as `gpio.h`
  # rather than as `robohub/hal/gpio.h`. The two answer to different names, so
  # they are separate directories and a build needs both.
  include_dirs:
    - include/
    - include/robohub/
    - include/robohub/hal/
    - include/robohub/platform/
    # The vendor HAL's configuration header. It lives in `vendor/includes` beside
    # the fetched SDKs rather than among this module's own headers, because it is
    # this platform's answer to the vendor rather than part of the platform: it
    # exists because the vendor's umbrella header includes that name and the
    # vendor does not ship the file.
    #
    # It needs a directory of its own on the path for the same reason — what the
    # vendor writes is `#include "stm32h7xx_hal_conf.h"`, not the path to it.
    - vendor/includes/

  # No source_dirs: every source is named below.
  #
  # A directory scan compiles whatever is in the folder, which means a driver
  # written for a peripheral this program does not use is compiled anyway, and a
  # build grows a source nobody chose. It also makes a driver that does not compile
  # for this part a build that will not compile at all, because the file is in the
  # folder whether or not it belongs here. Naming is the only way "this build does
  # not use that driver" is something a file can say.

  # Which of this platform's drivers a program gets is the program's answer, not
  # an assumption made here.
  #
  # A driver implements an interface that robohub-common declares, and whether
  # that interface exists is decided by `CONFIG_RH_HAL_<DRIVER>` in the program's
  # own configuration. Naming the pairing here is what makes the two agree: a
  # program that does not ask for I2C gets neither the interface nor the code
  # behind it, so the driver is out of the image rather than present and unused.
  #
  # Matched by file name, because these files live in the vendor's repository and
  # a rule written against a path would break when it moved.
  guarded_sources:
    - config: RH_HAL_GPIO
      sources:
        - stm32_gpio.c
    - config: RH_HAL_I2C
      sources:
        - stm32_i2c.c
    - config: RH_HAL_SPI
      sources:
        - stm32_spi.c
    - config: RH_HAL_RS485
      sources:
        - stm32_rs485.c
    - config: RH_HAL_UART
      sources:
        - stm32_uart.c
    - config: RH_HAL_TIMER
      sources:
        - stm32_timer.c

  # Every source of this platform, and every one of them is a file that exists.
  #
  # It used to name `src/error.c` and `src/platform/stm32_clock.c`, neither of
  # which is here — they were the error mapping and the clock tree as they were
  # before this platform had its own, and the list was left behind when they moved.
  # Nothing complained, because nothing checked: the compiler never saw this list,
  # since CMakeLists.txt is what a build compiles, and a name in a manifest is not a
  # file. A build that did look — `rho build` does, to tell a dependency that has not
  # been fetched from one whose code does not compile — reported them as missing and
  # refused to build for a board it could have built.
  #
  # Which is the whole argument for a declared source list being checked: a name
  # that is not a file is a claim nobody is making, and it is only harmless until
  # something acts on it.
  sources:
    - src/platform/stm32_error.c
    - src/platform/stm32_console.c
    - src/platform/stm32_fault.c
    - src/platform/stm32_systick.c
    - src/platform/stm32_platform.c
    - src/hal/stm32_gpio.c
    - src/hal/stm32_i2c.c
    - src/hal/stm32_spi.c
    - src/hal/stm32_uart.c
    - src/hal/stm32_rs485.c
    - src/hal/stm32_timer.c

package:
  kind: library
  # A C library has no binary to build. Without this the packer assumes a
  # component layout and runs `go build`, which fails on a module with no
  # go.mod.
  binary: false
  include:
    - module.yml
    - README.md
    - CMakeLists.txt
    - include
    - src
    - platform
    - boards
    - presets
    - targets
    - kconfig
    - cmake
  require:
    - module.yml
    - CMakeLists.txt
    - include
    - src
    - platform
    - presets
    - targets

# The interfaces this platform implements.
#
# It is a dependency like any other, and declaring it here is what puts its
# headers on the include path of everything this platform builds — so a program
# that uses only this platform's API does not have to name robohub-common
# itself, and one that does name it is saying it uses those headers directly.
#
# `path` is where robohub-common is on the machine this was written on and is
# tried first; `git` is where it is for anyone else.
depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

  # The vendor's HAL and CMSIS, fetched by a preset rather than named here: a
  # build brings the ones its preset names, and a checkout does not carry them.
  # The paths below are where a fetched preset's repositories are assembled.


config:
  # Where the target specs live, and where the presets live. A build is handed
  # these rather than finding them: a build that went looking for a `targets/`
  # directory in a repository would be working out what a module offers by
  # looking at its file layout.
  targets: targets
  presets: presets

  # The bare-metal build resolves through the `linux` dialect, which writes
  # `.config` and `include/generated/autoconf.h`.
  #
  # Only the symbols this platform owns are declared. The RH_HAL_* symbols belong
  # to robohub-common, which owns the interfaces: a project that depends on both
  # would otherwise have two fragments defining the same symbol, and which
  # definition won would depend on the order they were merged in.
  dialect: linux
  kconfig_fragments:
    - Kconfig

metadata:
  tags:
    - platform
    - stm32
    - hal
    - cmsis
    - embedded
    - baremetal
  stability: experimental
  visibility: public

# ---------------------------------------------------------------------------
#  What this platform provides
# ---------------------------------------------------------------------------
#
# The presets a build may ask this platform for. A preset is a fact about a
# piece of hardware, and it is written in a file beside this manifest: the
# repositories and the revisions, the directories of them that go on the include
# path, and the hardware they are for. This is the index, so that a list of what
# is on offer is a list rather than a wall.
#
# `target` is the target spec that builds each preset. A preset says what to
# fetch and a target says how, and the two name each other so a mismatch is a
# disagreement between two files rather than a build that quietly used the wrong
# one.

exports:
  cmake:
    target: "robohub-stm32"
    # Only the directories this module actually has. The HAL interfaces are
    # robohub-common's, and are declared by robohub-common; listing them here as
    # well would point CMake at a path that does not exist and fail the configure
    # with a message about an installation being faulty.
    include_dirs:
      - include
      - include/robohub/platform
      - vendor/includes
    # The interfaces this module implements are in that library, so a consumer of
    # this one needs them too. Naming it here rather than in every project that
    # pulls this in is what makes the dependency chain compose on its own.
    # The interfaces this module implements are in that library. A consumer of
    # this one needs them too, and naming the dependency here is what makes the
    # chain compose without every project repeating it.
    link_libraries:
      - "rho::robohub-common"

# When this module's tests are eligible to be built.
#
# The tests exercise the chip-independent half, which is ordinary portable C, so
# they run on the machine doing the building. They are not eligible for a
# bare-metal target: a hosted test links a hosted C library, and one built for an
# STM32 has no `_kill` or `_getpid` for it to resolve against.
#
# rho-target reads this and passes the decision to CMake, so a build is told
# which tests it may register rather than inferring it from the presence of a
# test directory.
testing:
  host_tests:
    enabled: true
    target_constraint: "native"
