# The device keystore in bank 2 of a dual-bank STM32H7
# (src/platform/stm32_keystore.c). Proposed until the maintainer approves them.
level: SUB
prefix: STM-KEY
title: STM32 keystore
requirements:
  - id: STM-KEY-0001
    title: The keystore is bank 2's last two sectors, written while bank 1 runs
    statement: >
      With RH_KEYSTORE_STM32_FLASH=1 the keystore shall hold the A/B records of
      robohub/keystore_core.h in the last two sectors of flash bank 2
      (0x081C0000-0x081FFFFF on the H753ZI), erasing one sector with
      HAL_FLASHEx_Erase, programming whole flash words padded with the erased
      value, and invalidating the data cache over what it changed.
    rationale: Writing bank 2 while the image runs from bank 1 stalls nothing, and a cached read after a program would see the old bytes.
    satisfies: [STM-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, flash]

  - id: STM-KEY-0002
    title: A keystore that overlaps the image refuses to write
    statement: >
      Before erasing or programming, the keystore shall compare the image's end
      in flash (`_sidata` plus the size of `.data`) with the keystore's start and
      refuse the erase or write when they overlap.
    rationale: A board that set the define without shortening its memory map must not erase its own code.
    satisfies: [STM-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, safety]

  - id: STM-KEY-0003
    title: The flash keystore builds only for dual-bank H7 parts
    statement: >
      Compiling with RH_KEYSTORE_STM32_FLASH=1 for a part without flash-word
      programming, dual banks and a bank 2 base shall fail with a message.
    rationale: The sector arithmetic is the dual-bank H7's; on another family it would point at code.
    satisfies: [STM-0004]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore]
