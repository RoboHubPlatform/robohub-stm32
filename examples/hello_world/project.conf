# The application's configuration.
#
# The symbols a program may set are declared by the modules it depends on; this
# file says which of them this application sets. A build merges the fragments of
# every module in the graph with this file on top, and the result is the
# configuration header the sources are compiled against.
#
# So what is in the firmware is what is written here. A driver that is not asked
# for is not compiled: it stays in the platform, and it is out of the binary. That
# is why this file rather than an edited source list — a driver is available to
# every program on this platform, and this says whether this one uses it.

# The two peripherals this program needs, and no others.
#
# A console to say things with, and a pin to show that something happened. I2C,
# SPI and RS485 are not mentioned because the program does not use them, and a
# program that did would say so here rather than in a list of files somewhere else.
CONFIG_RH_HAL_UART=y
CONFIG_RH_HAL_GPIO=y

# The platform's own: the clock, and checking a driver's arguments rather than
# writing to a peripheral that was not configured.
CONFIG_ROBOHUB_STM32=y
CONFIG_ROBOHUB_STM32_CLOCK=y
CONFIG_ROBOHUB_STM32_ASSERT=y

# This program's own.
CONFIG_HELLO_WORLD_BLINK_MS=1000
