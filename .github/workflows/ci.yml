# CI for this repository: the RoboHub workflow every repository in the
# ecosystem calls, so the steps are written once (robohub/.github/workflows).
#
# Every example is built for every board in `hardware.supported`; the Arm
# toolchain they need comes from this platform's own system_deps.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: RoboHubPlatform/robohub/.github/workflows/robohub-ci.yml@main
    secrets: inherit
    with:
      siblings: robohub-common
      components: rho-cimport rho-target rho-kconfig rho-robohub rho-test-gtest
      targets: nucleo-f412zg nucleo-f429zi nucleo-f446ze nucleo-h753zi
      build: examples/*/hello_world
      machine: true
